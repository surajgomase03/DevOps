--- 
- name: Install package
  gather_facts: true
  vars:
    user:
      - name: alpha
        shell: /bin/bash
      - name: raju
        shell: /bin/bash
      - name: suraj
        shell: /bin/bash
  tasks:
    - name: Install packaget
      package:
        name: "{{ item }}"
        state: present
      loop:
        - nginx
        - git
        - curl
    - name: Loops with Varibales
      user:
        name: "{{ item.name }}"
        shell: "{{ item.shell }}"
        state: present
      loop: "{{ user }}"
        